name: capability-package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consumer-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-15
            python: "3.12"
          - os: macos-15
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: jevdual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          version: "0.12.5"
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          toolchain: 1.97.1
      - name: Rebuild and check dependency-free installed CLI
        run: python scripts/capability_package_check.py --run-dir "$GITHUB_WORKSPACE/output/ci-package"
      - name: Verify installed unified agent discovery outside checkout
        run: python scripts/unified_cli_check.py --python "$GITHUB_WORKSPACE/output/ci-package/venv/bin/python"
      - name: Build CUA dependency wheel from pinned native source
        if: runner.os == 'macOS'
        run: uv build vendor/cua-driver --wheel --out-dir "$GITHUB_WORKSPACE/output/ci-cua"
      - name: Fresh binary dependency installation on macOS
        if: runner.os == 'macOS'
        run: |
          python scripts/capability_clean_install.py \
            --python "$(command -v python)" \
            --wheel "$GITHUB_WORKSPACE"/output/ci-package/build-one/*.whl \
            --find-links "$GITHUB_WORKSPACE/output/ci-cua" \
            --run-dir "$GITHUB_WORKSPACE/output/ci-dependencies"
      - name: Verify install-once bundle and installed simulator
        if: runner.os == 'macOS'
        run: |
          python scripts/build_agent_bundle.py --cua-wheel "$GITHUB_WORKSPACE"/output/ci-cua/*.whl --output "$GITHUB_WORKSPACE/output/ci-agent-bundle"
          python "$GITHUB_WORKSPACE/output/ci-agent-bundle/install.py" --python "$(command -v python)" --venv "$GITHUB_WORKSPACE/output/ci-agent-installed"
          python scripts/unified_cli_check.py --python "$GITHUB_WORKSPACE/output/ci-agent-installed/bin/python" --tools
      - name: Retain candidate artifact and qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-${{ matrix.os }}-py${{ matrix.python }}
          if-no-files-found: error
          path: |
            output/ci-package/receipt.json
            output/ci-package/build-one/*.whl
            output/ci-package/*.log
            output/ci-dependencies/receipt.json
            output/ci-dependencies/*.log
            output/ci-cua/*.whl
            output/ci-agent-bundle/install.py
            output/ci-agent-bundle/MANIFEST.json
            output/ci-agent-bundle/*.whl
