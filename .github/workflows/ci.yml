name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jevdual
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install CUA source-build prerequisites
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libdbus-1-dev libx11-dev libxi-dev libxtst-dev libxext-dev libwayland-dev libxkbcommon-dev
      - name: Install (builds the PyO3 crate)
        run: uv sync
      - name: Lint
        run: uv run ruff check python evals tests scripts
      - name: Browser inspection tests (no dependencies)
        working-directory: .
        run: node --test tools/browser-inspection/*.test.mjs tools/inspection-experiments/*.test.mjs tools/inspection-transport/*.test.mjs
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Unit and equality tests (no keys, no browser)
        run: uv run pytest -q -m "not browser"
      - name: Camera, desk inbox and workbench conformance (synthetic inputs)
        run: |
          uv run ruff check ../tools/camera-capture-experiment ../tools/desk-inbox-experiment ../tools/workbench-notes ../tools/physical-workcell
          uv run python -m unittest discover -s ../tools/camera-capture-experiment -p 'test_*.py' -v
          uv run pytest -q ../tools/desk-inbox-experiment/test_inbox.py ../tools/workbench-notes/test_workbench.py
      - name: Install pinned physical simulator and headless rendering libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          uv venv --python 3.12 tools/physical-workcell/.venv
          uv pip install --python tools/physical-workcell/.venv/bin/python -r tools/physical-workcell/requirements.txt
      - name: Physical workcell conformance (simulation, no model calls)
        working-directory: .
        env:
          MUJOCO_GL: egl
        run: tools/physical-workcell/.venv/bin/python -m unittest discover -s tools/physical-workcell -p 'test_*.py' -v
