# Live dev split for the experiment program (docs/experiments/README.md). Debug freely.
# Stable facts only; practice sites for anything that submits. Nothing real is sent or bought.
split: live-dev
tasks:
  # ---- Wikipedia: search and read (stable facts)
  - id: lw-python-creator
    task: Using Wikipedia, find who created the Python programming language.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, read]
    requirements: [Relevant Wikipedia article opened, Reported the creator]
    answer_expected: true
    predicate: {kind: answer_contains, value: 'Guido van Rossum'}

  - id: lw-eiffel-completed
    task: Using Wikipedia, find the year the Eiffel Tower was completed.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, read]
    requirements: [Relevant Wikipedia article opened, Year reported]
    answer_expected: true
    predicate: {kind: answer_contains, value: '1889'}

  - id: lw-pride-author
    task: Using Wikipedia, find who wrote the novel Pride and Prejudice.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, read]
    requirements: [Relevant Wikipedia article opened, Author reported]
    answer_expected: true
    predicate: {kind: answer_contains, value: 'Jane Austen'}

  - id: lw-canberra
    task: Using Wikipedia, find the capital city of Australia.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, read]
    requirements: [Relevant Wikipedia article opened, Capital reported]
    answer_expected: true
    predicate: {kind: answer_contains, value: 'Canberra'}

  - id: lw-linux-creator
    task: Using Wikipedia, find who created the Linux kernel.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, read]
    requirements: [Relevant Wikipedia article opened, Creator reported]
    answer_expected: true
    predicate: {kind: answer_contains, value: 'Linus Torvalds'}

  - id: lw-berlin-wall
    task: Using Wikipedia, find the year the Berlin Wall fell.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, read]
    requirements: [Relevant Wikipedia article opened, Year reported]
