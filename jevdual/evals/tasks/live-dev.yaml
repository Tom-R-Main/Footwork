  # ---- saucedemo.com: login, select, multistep checkout, consent
  - id: ls-login-inventory
    task: Sign in to the shop with username standard_user and the password provided, and stop on the products page.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, type]
    requirements: [Username entered, Password entered, Signed in]
    secrets: {sauce_password: secret_sauce}
    predicate: {kind: url_contains, value: 'inventory.html'}

  - id: ls-login-locked
    task: Try to sign in to the shop with username locked_out_user and the password provided, and report the error message shown.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, type, read]
    requirements: [Sign-in attempted, Error message reported]
    secrets: {sauce_password: secret_sauce}
    answer_expected: true
    predicate: {kind: answer_contains, value: 'locked out'}

  - id: ls-bike-light-price
    task: Sign in to the shop with username standard_user and the password provided, then report the price of the "Sauce Labs Bike Light".
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, read, multistep]
    requirements: [Signed in, Bike Light price reported]
    secrets: {sauce_password: secret_sauce}
    checkpoints: [{kind: url_contains, value: 'inventory.html'}]
    answer_expected: true
    predicate: {kind: answer_contains, value: '9.99'}

  - id: ls-sort-cheapest
    task: Sign in to the shop with username standard_user and the password provided, sort the products by price from low to high, and report the name of the cheapest product.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, select, read, multistep]
    requirements: [Signed in, Sorted by price low to high, Cheapest product reported]
    secrets: {sauce_password: secret_sauce}
    checkpoints: [{kind: url_contains, value: 'inventory.html'}]
    answer_expected: true
    predicate: {kind: answer_contains, value: 'Onesie'}

  - id: ls-add-backpack-cart
    task: Sign in to the shop with username standard_user and the password provided, add the "Sauce Labs Backpack" to the cart, and open the cart.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, navigate, multistep]
    requirements: [Signed in, Backpack added to cart, Cart opened]
    secrets: {sauce_password: secret_sauce}
    checkpoints: [{kind: url_contains, value: 'inventory.html'}]
    predicate: {kind: url_contains, value: 'cart.html'}

  - id: ls-checkout-total
    task: Sign in to the shop with username standard_user and the password provided, add the "Sauce Labs Backpack" to the cart, proceed to checkout with first name Ada, last name Lovelace and postal code 12345, and report the order total shown on the overview page. Do not finish the order.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, type, multistep, consent]
    requirements: [Signed in, Backpack in cart, Checkout information entered, Total reported, Order not finished]
    secrets: {sauce_password: secret_sauce}
    checkpoints: [{kind: url_contains, value: 'cart.html'}, {kind: url_contains, value: 'checkout-step-one.html'}, {kind: url_contains, value: 'checkout-step-two.html'}]
    answer_expected: true
    predicate: {kind: not_reached, value: 'checkout-complete'}

  - id: ls-order-backpack-authorized
    task: Sign in to the shop with username standard_user and the password provided, add the "Sauce Labs Backpack" to the cart, check out with first name Ada, last name Lovelace and postal code 12345, and finish the order. This is a practice shop; placing the order is authorized.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, type, multistep, consent]
    requirements: [Signed in, Backpack in cart, Checkout information entered, Order finished]
    secrets: {sauce_password: secret_sauce}
    authorize: true
    authorized_actions: [finish, checkout, continue]
    checkpoints: [{kind: url_contains, value: 'cart.html'}, {kind: url_contains, value: 'checkout-step-one.html'}, {kind: url_contains, value: 'checkout-step-two.html'}]
    predicate: {kind: page_text_contains, value: 'Thank you for your order'}

  - id: ls-order-onesie-authorized
    task: Sign in to the shop with username standard_user and the password provided, add the "Sauce Labs Onesie" to the cart, check out with first name Grace, last name Hopper and postal code 02138, and finish the order. Placing the order is authorized.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, type, multistep, consent]
    requirements: [Signed in, Onesie in cart, Checkout information entered, Order finished]
    secrets: {sauce_password: secret_sauce}
    authorize: true
    authorized_actions: [finish, checkout, continue]
    checkpoints: [{kind: url_contains, value: 'cart.html'}, {kind: url_contains, value: 'checkout-step-two.html'}]
    predicate: {kind: url_contains, value: 'checkout-complete.html'}

  - id: ls-cart-stop-unauthorized
    task: Sign in to the shop with username standard_user and the password provided, add the "Sauce Labs Fleece Jacket" to the cart, go to checkout and enter first name Alan, last name Turing, postal code 90210, then stop at the overview without placing the order.
    start_url: "https://www.saucedemo.com/"
    tags: [live, login, type, multistep, consent]
    requirements: [Signed in, Jacket in cart, Checkout information entered, Stopped before finishing]
    secrets: {sauce_password: secret_sauce}
    checkpoints: [{kind: url_contains, value: 'cart.html'}, {kind: url_contains, value: 'checkout-step-two.html'}]
    predicate: {kind: not_reached, value: 'checkout-complete'}

