  # ---- Wikipedia: multistep chains (search, follow a link, read)
  - id: lw-chain-python-guido
    task: On Wikipedia, open the article "Python (programming language)", then follow the link to the article about its creator and stop there.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, multistep]
    requirements: [Python article opened, Creator's article opened]
    checkpoints: [{kind: url_contains, value: 'Python_(programming_language)'}]
    predicate: {kind: url_contains, value: 'Guido_van_Rossum'}

  - id: lw-chain-rust-hoare
    task: On Wikipedia, open the article "Rust (programming language)", find who its original designer was, then open that person's Wikipedia article and stop there.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, multistep]
    requirements: [Rust article opened, Designer's article opened]
    checkpoints: [{kind: url_contains, value: 'Rust_(programming_language)'}]
    predicate: {kind: url_contains, value: 'Graydon_Hoare'}

  - id: lw-chain-turing-machine
    task: On Wikipedia, open the article "Alan Turing", then follow a link from it to the article "Turing machine" and stop there.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, multistep]
    requirements: [Alan Turing article opened, Turing machine article opened]
    checkpoints: [{kind: url_contains, value: 'Alan_Turing'}]
    predicate: {kind: url_contains, value: 'Turing_machine'}

  - id: lw-chain-austen-year
    task: On Wikipedia, open the article "Jane Austen", follow the link to "Pride and Prejudice", and report the year the novel was first published.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, read, multistep]
    requirements: [Jane Austen article opened, Pride and Prejudice article opened, Year reported]
    checkpoints: [{kind: url_contains, value: 'Jane_Austen'}, {kind: url_contains, value: 'Pride_and_Prejudice'}]
    answer_expected: true
    predicate: {kind: answer_contains, value: '1813'}

  - id: lw-chain-eiffel-gustave
    task: On Wikipedia, open the article "Eiffel Tower", follow the link to the article about Gustave Eiffel, and report the year he was born.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, read, multistep]
    requirements: [Eiffel Tower article opened, Gustave Eiffel article opened, Birth year reported]
    checkpoints: [{kind: url_contains, value: 'Eiffel_Tower'}, {kind: url_contains, value: 'Gustave_Eiffel'}]
    answer_expected: true
    predicate: {kind: answer_contains, value: '1832'}

  - id: lw-chain-dune-herbert
    task: On Wikipedia, open the article "Dune (novel)", follow the link to the article about its author, and report the year the author was born.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, read, multistep]
    requirements: [Dune article opened, Author's article opened, Birth year reported]
    checkpoints: [{kind: url_contains, value: 'Dune_(novel)'}, {kind: url_contains, value: 'Frank_Herbert'}]
    answer_expected: true
    predicate: {kind: answer_contains, value: '1920'}

  - id: lw-chain-curie-nobel
    task: On Wikipedia, open the article "Marie Curie", follow the link to the article "Nobel Prize in Physics", and report the year that prize was first awarded.
    start_url: "https://en.wikipedia.org/wiki/Main_Page"
    tags: [live, search, navigate, read, multistep]
    requirements: [Marie Curie article opened, Nobel Prize in Physics article opened, Year reported]
    checkpoints: [{kind: url_contains, value: 'Marie_Curie'}, {kind: url_contains, value: 'Nobel_Prize_in_Physics'}]
    answer_expected: true
    predicate: {kind: answer_contains, value: '1901'}

