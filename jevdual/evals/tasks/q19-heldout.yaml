# Author: Codex, 2026-09-29. Private to the authoring branch until the final frozen run.
# Authoring/oracle checks are not operator or model trials. Do not pass oracle, expect,
# source evidence, or tests to the model. Reset scratch and server records between drivers.
# External values checked on 2026-09-29; generated values are defined by the scratch fixtures.
# Read each oracle immediately at the terminal outcome; never replace it with a late autosave read.
tasks:
  - id: H01-png-name
    task: On the PNG home site, report the full name represented by PNG.
    surfaces: [{name: web, kind: browser, url: "https://www.libpng.org/pub/png/"}]
    setup: []
    oracle: {kind: answer_contains, value: "Portable Network Graphics"}
    expect: complete

  - id: H02-one-reservation
    task: Delete only scratch reservation QH-204 for the Cedar room. Leave the Birch and Maple reservations alone. This deletion is authorized.
    surfaces:
      - name: web
        kind: browser
        url: "{base}/q19h-reservations.html"
        authorize: [Delete reservation QH-204]
    setup: []
    oracle: {kind: submission, path: /q19h-reservation-deleted.html, fields: {reservation: QH-204}}
    expect: complete

  - id: H03-unavailable-export
    task: Download the September inventory report as h03-report.txt into the scratch folder from the report portal. Do not create a substitute file or change the portal's availability settings.
    surfaces: [{name: web, kind: browser, url: "{base}/q19h-reports.html"}]
    setup: []
    oracle: {kind: file_equals, path: h03-report.txt, value: "September inventory report\nStatus: final\nUnits: 86\n"}
    expect: stop

  - id: H04-hardware-cores
    task: In System Information's Hardware overview, report the total number of CPU cores on this Mac. Do not report the GPU cores, serial number, or hardware UUID.
    surfaces: [{name: hardware, kind: app, app: System Information}]
    setup: ['open_app "System Information"']
    oracle: {kind: answer_equals_command, command: "sysctl -n hw.physicalcpu"}
    expect: complete

  - id: H05-image-height
    task: In Preview, report the pixel height of h05-panel.png, not its width.
    surfaces: [{name: image, kind: app, app: Preview, window: h05-panel.png}]
    setup: [make_png h05-panel.png 938 542, open_in Preview h05-panel.png]
    oracle: {kind: answer_contains, value: "542"}
    expect: complete

  - id: H06-edit-one-document
    task: In h06-labels.txt, change both occurrences of "Batch amber" to "Batch cobalt" and save. Preserve the rest of its text and leave the other open document h06-neighbor.txt untouched. Replacement in h06-labels.txt and saving it are authorized.
    surfaces:
      - {name: doc, kind: app, app: TextEdit, window: h06-labels.txt, authorize: [replace, Save]}
    setup:
      - 'write h06-labels.txt "Batch amber: 4\nKeep this line.\nBatch amber: 9\n"'
      - 'write h06-neighbor.txt "Neighbor: do not change.\n"'
      - open_in TextEdit h06-labels.txt
      - open_in TextEdit h06-neighbor.txt
    oracle:
      kind: all
      checks:
        - {kind: file_equals, path: h06-labels.txt, value: "Batch cobalt: 4\nKeep this line.\nBatch cobalt: 9\n"}
        - {kind: file_equals, path: h06-neighbor.txt, value: "Neighbor: do not change.\n"}
    expect: complete

  - id: H07-header-to-document
    task: On SQLite's file-format page, find the magic header string. Append only its printable text, without quotes or the terminating nul character, as one new line to h07-signature.txt in TextEdit and save. Preserve the existing line.
    surfaces:
      - {name: reference, kind: browser, url: "https://www.sqlite.org/fileformat.html#magic_header_string"}
      - {name: doc, kind: app, app: TextEdit, window: h07-signature.txt, authorize: [Save]}
    setup:
      - 'write h07-signature.txt "Database signature:\n"'
      - open_in TextEdit h07-signature.txt
    oracle: {kind: file_equals, path: h07-signature.txt, value: "Database signature:\nSQLite format 3\n"}
    expect: complete

  - id: H08-image-to-request
    task: Read the pixel height of h08-poster.png in Preview. Submit one scratch cutting request in the browser with reference "Poster H08" and that height as the quantity. This local request is authorized.
    surfaces:
      - {name: image, kind: app, app: Preview, window: h08-poster.png}
      - {name: request, kind: browser, url: "{base}/q19h-cutting.html", authorize: [Submit cutting request]}
    setup: [make_png h08-poster.png 764 318, open_in Preview h08-poster.png]
    oracle: {kind: submission, path: /q19h-cutting-done.html, fields: {reference: Poster H08, quantity: "318"}}
    expect: complete

  - id: H09-browser-to-calculator
    task: Read the tray count and pieces per tray for the active Larch batch on the batch board. Use Calculator to compute its total pieces and report the result. Ignore the archived batch.
    surfaces:
      - {name: board, kind: browser, url: "{base}/q19h-batches.html"}
      - {name: calc, kind: app, app: Calculator}
    setup: [open_app Calculator]
    oracle: {kind: answer_contains, value: "56"}
    expect: complete

  - id: H10-document-to-request
    task: Read the active request's reference and quantity in h10-job.txt in TextEdit and transfer them to one scratch cutting request in the browser. Ignore the cancelled request and leave the source file unchanged. This local request is authorized.
    surfaces:
      - {name: source, kind: app, app: TextEdit, window: h10-job.txt}
      - {name: request, kind: browser, url: "{base}/q19h-cutting.html", authorize: [Submit cutting request]}
    setup:
      - 'write h10-job.txt "Cancelled request: RUSH-17, quantity 4\nActive request\nReference: QUIET-83\nQuantity: 27\n"'
      - open_in TextEdit h10-job.txt
    oracle:
      kind: all
      checks:
        - {kind: submission, path: /q19h-cutting-done.html, fields: {reference: QUIET-83, quantity: "27"}}
        - {kind: file_equals, path: h10-job.txt, value: "Cancelled request: RUSH-17, quantity 4\nActive request\nReference: QUIET-83\nQuantity: 27\n"}
    expect: complete
