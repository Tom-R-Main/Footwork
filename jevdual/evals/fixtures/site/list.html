<html lang="en"><head><meta charset="utf-8"><title>Catalog</title>
<style>body{font-family:system-ui;margin:2rem;max-width:56rem}nav a{margin-right:.25rem}table{border-collapse:collapse}td,th{border:1px solid #999;padding:.3rem .6rem}.error{color:#b00020}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}.dialog{background:#fff;padding:1.5rem;border-radius:8px;max-width:28rem}.banner{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:1rem;display:flex;justify-content:space-between}</style>

<h1>Catalog</h1>
<p>Showing page <span id="pn"></span> of 3.</p><ul id="items"></ul><p id="pager"></p>
<script>
const PAGES=[["Anchor, 12 kg","Bilge pump","Chart of the bay","Deck brush","Ensign, small"],["Fender, blue","Gaff hook","Halyard, 20 m","Ice box","Jib sheet"],["Kedge anchor","Life ring","Mooring line","Navigation light","Oar, spruce"]];
const p=Math.min(3,Math.max(1,parseInt(new URLSearchParams(location.search).get("page")||"1",10)));
document.getElementById("pn").textContent=p;
document.getElementById("items").innerHTML=PAGES[p-1].map(i=>`<li>${i}</li>`).join("");
document.getElementById("pager").innerHTML=(p>1?`<a href="/list.html?page=${p-1}" rel="prev">Previous page</a> `:"")+(p<3?`<a href="/list.html?page=${p+1}" rel="next">Next page</a>`:"<span>End of catalog</span>");
</script>
</body></html>
