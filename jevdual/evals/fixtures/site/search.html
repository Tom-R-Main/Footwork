<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Search</title>
<style>body{font-family:system-ui;margin:2rem;max-width:56rem}nav a{margin-right:.25rem}table{border-collapse:collapse}td,th{border:1px solid #999;padding:.3rem .6rem}.error{color:#b00020}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}.dialog{background:#fff;padding:1.5rem;border-radius:8px;max-width:28rem}.banner{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:1rem;display:flex;justify-content:space-between}</style>
</head><body>
<nav><a href="/">Home</a> | <a href="/search.html">Search</a> | <a href="/list.html">Catalog</a> | <a href="/form.html">Contact</a> | <a href="/modal.html">Announcements</a> | <a href="/login.html">Sign in</a> | <a href="/checkout.html">Checkout</a> | <a href="/article.html">Article</a> | <a href="/enter-submit.html">Tracking</a></nav>
<h1>Search</h1>
<form action="/search.html" method="get" role="search"><label for="q">Search products</label> <input id="q" type="search" name="q" placeholder="e.g. lantern"> <button type="submit">Search</button></form>
<p id="status"></p><ul id="results"></ul>
<script>
const ITEMS=[["Brass lantern","$34.50"],["Storm lantern","$21.00"],["Oilskin coat","$88.00"],["Wool blanket","$45.00"],["Rope, 30 m","$19.99"],["Signal flag set","$62.00"],["Tide tables 2026","$9.50"],["Foghorn (hand)","$120.00"],["Compass, brass","$57.25"],["Lighthouse postcard","$1.25"]];
const q=(new URLSearchParams(location.search).get("q")||"").trim().toLowerCase();
const hits=q?ITEMS.filter(([n])=>n.toLowerCase().includes(q)):[];
document.getElementById("q").value=q;
document.getElementById("status").textContent=q?`${hits.length} result${hits.length===1?"":"s"} for "${q}"`:"Enter a search term.";
document.getElementById("results").innerHTML=hits.map(([n,p])=>`<li><a href="/product.html?name=${encodeURIComponent(n)}">${n}</a> — <span class="price">${p}</span></li>`).join("");
</script>
</body></html>
