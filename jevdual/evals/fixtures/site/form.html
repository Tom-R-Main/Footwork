<h1>Contact us</h1>
<form action="/confirm.html" method="get">
<p><label for="name">Name</label> <input id="name" name="name" required></p>
<p><label for="email">Email</label> <input id="email" name="email" type="email" required></p>
<p><label for="topic">Topic</label> <select id="topic" name="topic"><option value="">Choose…</option><option>Order question</option><option>Damaged item</option><option>Returns</option><option>Other</option></select></p>
<p><label><input type="checkbox" name="newsletter" value="yes"> Subscribe to the newsletter</label></p>
<p><label for="message">Message</label><br><textarea id="message" name="message" rows="4" cols="50"></textarea></p>
<p><button type="submit">Send message</button></p>
</form>
