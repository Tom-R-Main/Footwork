[package]
name = "jevdual-core"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native hot paths for jevdual (paint-order occlusion, DOMSnapshot lookup, element hashing, evidence matching)."

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py311"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "snapshot"
harness = false

[lints.clippy]
all = "warn"
