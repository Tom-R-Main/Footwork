    #receipt{position:absolute;left:20px;top:310px;margin:0}</style></head><body><h1>Image editor</h1><p>Choose the crop tool.</p><button id="tool-a" style="left:80px;top:100px;width:60px;height:60px"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32"><path d="M7 2v23h23M2 7h23v23M12 12h8v8h-8z" fill="none" stroke="#111" stroke-width="3"/></svg></button><button id="tool-b" style="left:180px;top:100px;width:60px;height:60px"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32"><path d="M26 11A10 10 0 1 0 25 24M26 11l-9 -1M26 11l-1 -9" fill="none" stroke="#111" stroke-width="3"/></svg></button><p id='receipt'>No action yet</p><script>window.fixtureState={mode:'none'};document.getElementById('tool-a').onclick=()=>{fixtureState.mode='crop';document.getElementById('receipt').textContent='Crop mode active'};document.getElementById('tool-b').onclick=()=>{fixtureState.mode='rotate';document.getElementById('receipt').textContent='Rotate mode active'};</script></body></html>
