<!doctype html><html><head><meta charset="utf-8"><title>Visual task</title>
    <style>html,body{margin:0;width:640px;height:360px;overflow:hidden;background:#fff;
    color:#111;font:14px Arial}h1{font-size:18px;margin:20px}p{margin:20px}
    button{background:#eee;border:2px solid #111;position:absolute;cursor:pointer;
    box-sizing:border-box}canvas{position:absolute;left:0;top:70px}
    #receipt{position:absolute;left:20px;top:310px;margin:0}</style></head><body><h1>Delivery map</h1><p>Choose a marker inside the shaded delivery zone.</p><canvas id="map" width="640" height="220"></canvas><button id="marker-a" aria-label="marker-a" style="left:140px;top:170px;width:20px;height:20px;border-radius:50%;background:#111;color:#fff"></button><button id="marker-b" aria-label="marker-b" style="left:350px;top:190px;width:20px;height:20px;border-radius:50%;background:#111;color:#fff"></button><p id='receipt'>No action yet</p><script>const c=document.getElementById('map').getContext('2d');c.strokeStyle='#ddd';for(let x=0;x<640;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,220);c.stroke()}for(let y=0;y<220;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(640,y);c.stroke()}c.fillStyle='#eee';c.fillRect(40,10,520,200);c.fillStyle='#111';c.font='16px Arial';c.fillText('Zone layer unavailable',180,100);window.fixtureState={selected:null};for(const b of document.querySelectorAll('button'))b.onclick=()=>{fixtureState.selected=b.id;document.getElementById('receipt').textContent='Selected '+b.id};</script></body></html>
