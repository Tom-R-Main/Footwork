<!doctype html><html><head><meta charset="utf-8"><title>Visual task</title>
    <style>html,body{margin:0;width:640px;height:360px;overflow:hidden;background:#fff;
    color:#111;font:14px Arial}h1{font-size:18px;margin:20px}p{margin:20px}
    button{background:#eee;border:2px solid #111;position:absolute;cursor:pointer;
    box-sizing:border-box}canvas{position:absolute;left:0;top:70px}
    #receipt{position:absolute;left:20px;top:310px;margin:0}</style></head><body><h1>Sample approval</h1><p id="layout-status">Layout revision 1</p><button id="approve" aria-label="Approve sample" style="left:80px;top:140px;width:120px;height:50px">Approve sample</button><button id="cancel" aria-label="Cancel sample" style="left:300px;top:140px;width:120px;height:50px">Cancel sample</button><p id='receipt'>No action yet</p><script>window.fixtureState={action:null};document.getElementById('approve').onclick=()=>{fixtureState.action='approve';document.getElementById('receipt').textContent='Sample approved'};document.getElementById('cancel').onclick=()=>{fixtureState.action='cancel';document.getElementById('receipt').textContent='Sample cancelled'};window.changeLayout=()=>{document.getElementById('approve').style.left='300px';document.getElementById('cancel').style.left='80px';document.getElementById('layout-status').textContent='Layout revision 2'};window.coverLayout=()=>{const d=document.createElement('div');d.id='cover';d.textContent='Updating layout; controls unavailable';d.style='position:absolute;left:50px;top:120px;width:420px;height:100px;background:#ddd;z-index:5';document.body.appendChild(d)};</script></body></html>
