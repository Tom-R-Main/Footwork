[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cua-driver"
version = "0.38.0+footwork.d5373879"
description = "Rust-backed Cua Driver SDK and bundled executable for client applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cua-driver = "cua_driver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_driver"]
pure-python = false

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "hatch_build.py", "build_support.py", "native-source.tar.gz", "README.md", "LICENSE", "PROVENANCE.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "build_support.py" },
    { file = "native-source.tar.gz" },
    { file = "src/cua_driver/*.py" },
]
