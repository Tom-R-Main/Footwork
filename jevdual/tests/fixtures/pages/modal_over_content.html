<!doctype html><html><head><title>Modal over content fixture</title>
<style>
 body{font-family:sans-serif;margin:0}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}
 .card{border:1px solid #ccc;padding:12px}
 .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5)}
 .modal{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:360px;background:#fff;padding:24px;border-radius:8px}
</style></head><body>
<header><nav><a href="/home">Home</a> <a href="/shop">Shop</a> <a href="/about">About</a> <button>Search</button></nav></header>
<main class="grid">
<script>for(let i=1;i<=40;i++){document.write(`<div class="card"><h3>Product ${i}</h3><p>Nice product number ${i}.</p><a href="/p/${i}">View</a> <button>Add to cart ${i}</button></div>`)}</script>
</main>
<div class="backdrop"></div>
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <h2 id="mt">Subscribe to our newsletter</h2>
  <label>Email <input type="email" placeholder="you@example.com"></label>
  <button>Subscribe</button> <button aria-label="Close dialog">×</button>
</div>
</body></html>
