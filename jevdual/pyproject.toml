[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "jevdual"
version = "0.0.1"
description = "Verified computer use for the browser and native macOS apps: a Jev guard and optional System 1 in front of any driver, with Rust hot paths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "browser-use==0.13.14",
    "typesafe-sdk>=0.7,<1",
    "orjson>=3.10",
    "psutil==7.2.2",  # kernel process-start identity; already pinned in uv.lock
    "mcp==2.1.1",  # capability transport is direct, not an incidental browser dependency
    "packaging>=25,<27",  # required by installed dependency diagnostics
    "cua-driver==0.38.0+footwork.d5373879",  # pinned like browser-use: tests/contract/test_cua_driver_seams.py
    "jeepney==0.9.0 ; sys_platform == 'linux'",  # bounded AT-SPI exact-text access
    "pyobjc-framework-applicationservices>=12 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
tools = ["mujoco==3.15.0"]

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyyaml>=6.0.3",
    "pytest-httpserver>=1.1",
    "pytest-timeout>=2.4",
]

[tool.maturin]
python-source = "python"
module-name = "jevdual._core"
manifest-path = "crates/jevdual-core/Cargo.toml"
features = ["pyo3/extension-module"]
include = [{ path = "python/jevdual/_tool_resources/**/*", format = ["wheel", "sdist"] }]

[project.scripts]
footwork = "jevdual.cli:main"
footwork-capability = "jevdual.capability.cli:main"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "python/jevdual/_tool_resources/**/*" },
]

[tool.pytest.ini_options]
markers = [
    "browser: launches a headless browser (tests/test_agent_loop.py)",
    "live: acts on this machine's real apps and keyboard (tests/live; FOOTWORK_LIVE=1)",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["python/jevdual/_tool_resources"]
line-length = 110
target-version = "py311"

[tool.uv.sources]
cua-driver = { path = "vendor/cua-driver" }
